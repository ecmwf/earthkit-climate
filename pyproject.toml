[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=65", "setuptools-scm>=8", "wheel"]

[project]
authors = [
  {name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "earthkit-data>=0.17",
  "numpy>=1.22",
  "xarray>=2023.1",
  "xclim>=0.59.1",
  "xsdba>=0.5,<0.6"
]
description = "Tools for calculating climate indicies, climate change analysis and attribution."
dynamic = ["readme", "version"]
license = {file = "LICENSE"}
name = "earthkit-climate"
requires-python = ">=3.10"
optional-dependencies.dev = [
  "ipykernel",
  "ipython",
  "mypy",
  "pandas-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "ruff"
]
optional-dependencies.docs = [
  "furo",
  "nbsphinx",
  "roman-numerals-py>=3.1,<4",
  "sphinx",
  "sphinx-autoapi"
]

[tool.coverage.run]
branch = true

[tool.mypy]
exclude = ["build", "dist"]
explicit_package_bases = true
files = ["src", "tests"]
namespace_packages = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "earthkit",
  "earthkit.data",
  "earthkit.data.*",
  "xclim",
  "xclim.*",
  "xsdba",
  "xsdba.*"
]

[tool.pytest.ini_options]
addopts = "-vv --cov=. --cov-report=html --doctest-glob='*.md' --doctest-glob='*.rst'"

[tool.ruff]
line-length = 120
preview = true
lint.ignore = [
  "D1",  # pydocstyle: Missing Docstrings
  "D107",  # pydocstyle: numpy convention
  "D203",
  "D205",
  "D212",
  "D213",
  "D401",
  "D402",
  "D413",
  "D415",
  "D416",
  "D417"
]
lint.select = [
  "D",  # pydocstyle
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "W"  # pycodestyle warnings
]
lint.per-file-ignores."docs/conf.py" = [
  "E501"  # line too long
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.package-data]
"earthkit.climate" = ["py.typed"]

# ---- Namespace package configuration ----
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_file = "src/earthkit/climate/version.py"
version_file_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
