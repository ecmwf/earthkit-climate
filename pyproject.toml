[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=65", "wheel", "setuptools-scm>=8"]

[project]
authors = [
  {name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.22",
  "xarray>=2023.1",
  "xclim>=0.50",
  "xsdba>=0.5,<0.6",
  "earthkit-data>=0.17.0"
]
description = "Tools for calculating climate indicies, climate change analysis and attribution."
dynamic = ["version", "readme"]
license = {file = "LICENSE"}
name = "earthkit-climate"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["black", "ruff", "mypy", "pre-commit", "make", "ipython"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autoapi", "nbsphinx"]
tests = ["pytest", "pytest-cov", "pytest-mock >=3.15.1,<4"]

[project.urls]
documentation = "https://earthkit-climate.readthedocs.io/"
issues = "https://github.com/ecmwf/earthkit-climate/issues"
repository = "https://github.com/ecmwf/earthkit-climate"

[tool.coverage.run]
branch = true

[tool.pixi.dependencies]
pixi-pycharm = ">=0.0.9,<0.0.10"
pytest = "*"
pytest-cov = "*"
pytest-mock = ">=3.15.1,<4"
python = "3.12.*"

# ---- Pixi environments ----
[tool.pixi.environments]
dev = {features = ["dev"]}
docs = {features = ["docs"]}

[tool.pixi.pypi-dependencies]
earthkit-plots = ">=0.5.0"

# ---- Pixi CONFIGURATION ----
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.ruff]
ignore = [
  "D1",  # pydocstyle: Missing Docstrings
  "D107",  # pydocstyle: numpy convention
  "D203",
  "D205",
  "D212",
  "D213",
  "D401",
  "D402",
  "D413",
  "D415",
  "D416",
  "D417"
]
line-length = 110
select = [
  "F",  # pyflakes
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "I",  # isort
  "D"  # pydocstyle
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

# ---- Namespace package configuration ----
[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools_scm]
write_to = "src/earthkit/climate/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
